nameOverride: developer-hub
permission:
  enabled: false
kubernetesPlugin:
  rbac:
    # -- Grant the chart's service account read-only access used by the Kubernetes plugin.
    enabled: true
    # -- Optional override; empty follows the upstream chart's generated service account name.
    serviceAccountName: ""
global:
  dynamic:
    # Both entries are level-0 includes read by the installer's fixed-filename
    # dynamic-plugins.yaml (level 1), which merge-dynamic-plugins.js now writes as part of
    # preInstallCommand (see global.veecode.preInstallCommand). The marketplace write-through
    # (DEVPORTAL_DB_PATH/extensions-install.yaml) no longer belongs here: it enters at level 1
    # instead, merged by that script alongside the operator config — this avoids the fatal
    # duplicate-OCI-plugin-key InstallException that would fire if the same plugin were declared
    # both here and in the operator config at level 0.
    # - dynamic-plugins.default.yaml is a relative include; the installer's CATALOG_INDEX_IMAGE
    #   handling only swaps in the catalog-index DPDY when an include's basename matches this
    #   exact filename, so the name must stay literal.
    # - the VeeCode product face is baked into the devportal-core image (OD1 phase A) and MUST
    #   stay listed; it is fail-closed at the installer level if missing (unlike the marketplace
    #   entry, which was only ever a warning).
    includes:
      - dynamic-plugins.default.yaml
      - /opt/app-root/src/dynamic-plugins.veecode.yaml
    # OD1 phase A: the VeeCode product face (Home, header, TechDocs,
    # Notifications, Tech Radar, Marketplace, theme, ...) used to live here as a
    # Helm list — which meant a customer setting this same key would silently
    # REPLACE the whole face instead of adding to it. The face now ships baked
    # into the devportal-core image
    # (/opt/app-root/src/dynamic-plugins.veecode.yaml) and is wired in via
    # `includes` above. This list is now purely ADDITIVE for customer plugins.
    # To disable one face plugin without touching the rest, add here:
    #   - package: <the exact ref from dynamic-plugins.veecode.yaml>
    #     disabled: true
    # Note: an override that also sets `pluginConfig` REPLACES that plugin's
    # whole pluginConfig block (no deep-merge) — see the face file's header.
    plugins: []

  # -- Shorthand for users who do not want to specify a custom HOSTNAME. Used ONLY with the DEFAULT upstream.backstage.appConfig value and with OCP Route enabled.
  clusterRouterBase: "apps.example.com"
  # -- Custom hostname shorthand, overrides `global.clusterRouterBase`, `upstream.ingress.host`, `route.host`, and url values in `upstream.backstage.appConfig`.
  host: ""
  # -- Enable service authentication within Backstage instance
  auth:
    # -- Backend service to service authentication
    # <br /> Ref: https://backstage.io/docs/auth/service-to-service-auth/
    backend:
      # -- Enable backend service to service authentication, unless configured otherwise it generates a secret value
      enabled: false
      # -- Instead of generating a secret value, refer to existing secret
      existingSecret: ""
      # -- Instead of generating a secret value, use the following value
      value: ""
  veecode:
    # !!! SECURITY: this deliberately maps unauthenticated users to ADMIN.
    # !!! Set this single key to false before exposing the portal to real users;
    # !!! then configure a real provider (GitLab/GitHub OAuth). RBAC enforcement
    # !!! is still off until the later M6 decision.
    guestAuth:
      enabled: true
    # Branding exposed as VALUES (M4.7 decision-round ruling 4). Defaults
    # reproduce the baked VeeCode brand; a consumer overrides title/width or
    # supplies its own logo without editing any file. Loaded LAST in the
    # --config chain (see extraAppConfig veecode-product), so these win.
    branding:
      title: "VeeCode DevPortal"
      fullLogoWidth: 180
      # Optional base64 data-URI overrides; empty keeps the baked logo/icon
      # from app-config.veecode-branding.yaml.
      fullLogo: ""
      iconLogo: ""
    # Help/Support menu destinations — point at VeeCode, not upstream RHDH
    # (M4.7 decision-round ruling 2).
    support:
      # VeeCode 2.x support destination: the GitHub Discussions of the
      # veecode-platform/support repo (chart V1 values.yaml:177). Both the
      # header Support button (url) and the dropdown link (docsUrl) point here.
      url: "https://github.com/veecode-platform/support/discussions"
      subtitle: "VeeCode DevPortal support"
      docsUrl: "https://github.com/veecode-platform/support/discussions"
    # The vendored deployment template prepends this command to the stock
    # install-dynamic-plugins init container. Consumers do not replace the
    # installer list or reproduce its seven install volumes.
    # NOTE: no app-config.veecode.yaml here — the image deleted that file at
    # 3.0.0-beta.1 (M4.6) and the pre-step bails SILENTLY (warn + exit 0) on a
    # missing --config, which would break marketplace persistence invisibly.
    # Relative invocation on purpose: the image ships the pre-step at
    # /opt/app-root/src/regenerate-extensions-install.js (the init container's
    # working directory) — same invocation the M4.5 harness proved live.
    #
    # app-config-from-configmap.yaml is the LAST --config on purpose: it is the
    # operator's own appConfig (the inline `backstage.appConfig` block, rendered
    # into the <fullname>-app-config ConfigMap and mounted into THIS init
    # container by backstage.initContainers[0].volumeMounts). The pre-step reads
    # config via @backstage/config-loader from the --config files it is handed,
    # so this is what makes it see `backend.database.prefix` (and anything else
    # the operator sets) exactly as the backend does — a single source of truth,
    # consumed by both. Without it the pre-step reads only the image-baked
    # app-configs, which carry no prefix, falls back to `backstage_plugin_`, and
    # on a shared Postgres reads whatever release owns that default prefix. That
    # was the v3 first-boot defect; the tenant-side /tmp/prefix-override.yaml hack
    # this replaces is now unnecessary.
    # merge-dynamic-plugins.js runs second, after the marketplace regen has written
    # DEVPORTAL_DB_PATH/extensions-install.yaml: it reads that file plus the operator config
    # (DEVPORTAL_OPERATOR_CONFIG) and writes the level-1 /opt/app-root/src/dynamic-plugins.yaml
    # the installer's fixed-filename lookup actually reads (operator plugins win on key conflict).
    preInstallCommand: >-
      node regenerate-extensions-install.js
      --config app-config.yaml
      --config app-config.example.yaml
      --config app-config.example.production.yaml
      --config app-config-from-configmap.yaml
      && node merge-dynamic-plugins.js
  # -- Catalog index configuration for automatic plugin discovery.
  # The `install-dynamic-plugins.py` script pulls this image if the `CATALOG_INDEX_IMAGE` environment variable is set.
  # The `dynamic-plugins.default.yaml` file will be extracted and written to `dynamic-plugins-root` volume mount.
  catalogIndex:
    image:
      registry: quay.io
      repository: veecode/plugin-catalog-index
      tag: "bs_1.52.0"
    # -- Extra catalog index images for additional plugin discovery in the Extensions UI.
    # Each item must include `registry`, `repository`, and `tag` fields; `name` is optional.
    # Only catalog entities are extracted from extra images (no `dynamic-plugins.default.yaml` handling).
    # @default -- `[]`
    extraImages: []
    # - name: community
    #   registry: ghcr.io
    #   repository: redhat-developer/rhdh-plugin-community-index
    #   tag: "1.10"
    # - registry: my-registry.example.com
    #   repository: my-org/my-rhdh-internal-plugin-catalog
    #   tag: "1.2.3"
  # -- Built-in Lightspeed feature configuration.
  # @default -- Use Lightspeed compatible settings / configurations.
  lightspeed:
    # -- Enable or disable the built-in Lightspeed feature.
    # FIXME: temporarily disabled due to DPDY issues; to re-enable in [RHIDP-15458](https://redhat.atlassian.net/browse/RHIDP-15458)
    enabled: false
    # -- Lightspeed plugins and their configuration. Override package references for disconnected environments.
    plugins:
      - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-lightspeed:{{ "{{inherit}}" }}'
        enabled: true

      - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-lightspeed-backend:{{ "{{inherit}}" }}'
        enabled: true
    runtimeVolume:
      # -- Name of the Kubernetes volume used for writable Lightspeed runtime storage.
      name: lightspeed-data
      # -- Mount path inside the container for Lightspeed runtime storage.
      mountPath: /tmp
      # -- Volume source used for writable Lightspeed runtime storage mounted at `/tmp`.
      # Supported values: `emptyDir`, `persistentVolumeClaim`.
      type: emptyDir
      # -- `emptyDir` configuration for the Lightspeed runtime data volume when `runtimeVolume.type=emptyDir`.
      emptyDir: {}
      # -- Existing PVC reference for the Lightspeed runtime data volume when `runtimeVolume.type=persistentVolumeClaim`.
      persistentVolumeClaim: {}
    ragVolume:
      # -- Name of the Kubernetes volume used for Lightspeed RAG data.
      name: lightspeed-rag
      # -- Mount path inside the init container for seeding RAG data.
      initMountPath: /rag-content
      # -- Mount path inside the sidecar container for serving RAG data.
      mountPath: /rag-content
      # -- `emptyDir` configuration for the RAG data volume.
      emptyDir: {}
    configMaps:
      - name: stack
        # -- Whether to create this ConfigMap from the bundled source file.
        # Set to false and provide `nameOverride` to use a pre-existing ConfigMap.
        create: true
        # -- Name of an existing ConfigMap to use instead. Required when `create` is false.
        nameOverride: ""
        mountPath: /app-root/lightspeed-stack.yaml
        subPath: lightspeed-stack.yaml
        # -- Bundled file used to populate the ConfigMap data when `create` is true.
        sourceFile: lightspeed-stack.yaml
        optional: false
      - name: config
        # -- Whether to create this ConfigMap from the bundled source file.
        # Set to false and provide `nameOverride` to use a pre-existing ConfigMap.
        create: true
        # -- Name of an existing ConfigMap to use instead. Required when `create` is false.
        nameOverride: ""
        mountPath: /app-root/config.yaml
        subPath: config.yaml
        # -- Bundled file used to populate the ConfigMap data when `create` is true.
        sourceFile: config.yaml
        optional: false
      - name: rhdh-profile
        # -- Whether to create this ConfigMap from the bundled source file.
        # Set to false and provide `nameOverride` to use a pre-existing ConfigMap.
        create: true
        # -- Name of an existing ConfigMap to use instead. Required when `create` is false.
        nameOverride: ""
        mountPath: /app-root/rhdh-profile.py
        subPath: rhdh-profile.py
        # -- Bundled file used to populate the ConfigMap data when `create` is true.
        sourceFile: rhdh-profile.py
        optional: false
    secret:
      # -- Whether to create a Lightspeed Secret from the bundled source file.
      create: true
      # -- Name of an existing Secret to use instead. Required when `create` is false.
      name: ""
      # -- Whether the Secret reference is optional in the pod spec.
      optional: false
      # -- Bundled file used to populate the Secret's `stringData` keys.
      sourceFile: secret.yaml
    initContainer:
      name: lightspeed-rag-init
      # -- Full image reference for the Lightspeed RAG bootstrap init container. Override for disconnected environments.
      image: quay.io/redhat-ai-dev/rag-content:release-1.10-lls-0.5.0-8c231a3b5177f12fff9db042dfa4091d8f2f26b3
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
      args:
        - >-
          mkdir -p /tmp/data &&
          echo 'Copying Lightspeed RAG data...' &&
          cp -r --no-preserve=mode,ownership /rag/vector_db /rag-content/ &&
          cp -r --no-preserve=mode,ownership /rag/embeddings_model /rag-content/ &&
          mkdir -p /rag-content/vector_db/notebooks &&
          chmod -R a+rwX /rag-content/embeddings_model /rag-content/vector_db &&
          echo 'Copy complete.'
      env: []
      # -- Resource requests/limits for the Lightspeed RAG bootstrap init container.
      resources:
        requests:
          cpu: 50m
          memory: 150Mi
        limits:
          cpu: 100m
          memory: 500Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        seccompProfile:
          type: "RuntimeDefault"
    sidecar:
      name: lightspeed-core
      # -- Full image reference for the Lightspeed Core sidecar. Override for disconnected environments.
      image: quay.io/lightspeed-core/lightspeed-stack:0.5.3
      imagePullPolicy: IfNotPresent
      portName: http-lightspeed
      containerPort: 8080
      command: []
      args: []
      env: []
      # -- Resource requests/limits for the Lightspeed Core sidecar.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        seccompProfile:
          type: "RuntimeDefault"
# -- Upstream Backstage [chart configuration](https://github.com/backstage/charts/blob/main/charts/backstage/values.yaml)
# @default -- Use Openshift compatible settings
upstream:
  serviceAccount:
    # The Kubernetes plugin ClusterRoleBinding targets this chart-owned account.
    create: true
    name: ""
  nameOverride: developer-hub
  backstage:
    image:
      registry: docker.io
      repository: veecode/devportal
      # This is the published 3.0.0-beta.6 image (merge writes to the data volume via baked symlink — EROFS fix; level-1 seam + face repin/anchor; on the
      # veecode/main product line, Backstage 1.52: OD1 baked product face +
      # build-time face gate + regen dedup; beta.3's 5 broken backend dist
      # refs fixed); its tag/digest matches appVersion.
      tag: 3.0.0-beta.7
      digest: sha256:c443520aebf72df6978b00657a31f8e7af0924096dd53d73cf46d1db98405946
      pullPolicy: IfNotPresent
    command: []
    # FIXME (tumido): USE POSTGRES_PASSWORD and POSTGRES_USER instead of POSTGRES_ADMIN_PASSWORD
    # This is a hack. In {fedora,rhel}/postgresql images, regular user is forbidden
    # from creating DBs in runtime. A single DB can be created ahead of time via
    # POSTGRESQL_DATABASE env variable (in this case via
    # upstream.postgresql.primary.extraEnvVars value), but this doesn't allow us to
    # create multiple DBs. Since Backstage requires by default 5 different DBs, we
    # can't accommodate that properly.
    appConfig:
      auth:
        providers: {}
      app:
        # Please update to match host in case you don't want to configure hostname via `global.clusterRouterBase` or `global.host` if not deploying on an openshift cluster.
        baseUrl: 'https://{{- include "rhdh.hostname" . }}'
      backend:
        baseUrl: 'https://{{- include "rhdh.hostname" . }}'
        cors:
          origin: 'https://{{- include "rhdh.hostname" . }}'
        database:
          client: pg
          connection:
            host: ${PG_HOST}
            port: ${PG_PORT}
            user: ${PG_USER}
            password: ${PG_PASSWORD}
            database: ${PG_DATABASE}
        auth:
          externalAccess:
            - type: legacy
              options:
                subject: legacy-default-config
                secret: ${BACKEND_SECRET}
    containerSecurityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      seccompProfile:
        type: "RuntimeDefault"
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2.5Gi
        ephemeral-storage: 5Gi
    startupProbe:
      # This gives enough time upon container startup before the liveness and readiness probes are triggered.
      # Giving (120s = initialDelaySeconds + failureThreshold * periodSeconds) to account for the worst case scenario.
      httpGet:
        path: /.backstage/health/v1/liveness
        port: backend
        scheme: HTTP
      initialDelaySeconds: 30
      timeoutSeconds: 4
      periodSeconds: 20
      successThreshold: 1
      failureThreshold: 3
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /.backstage/health/v1/readiness
        port: backend
        scheme: HTTP
      # Both liveness and readiness probes won't be triggered until the startup probe is successful.
      # The startup probe is already configured to give enough time for the application to be started.
      # So removing the additional delay here allows the readiness probe to be checked right away after the startup probe,
      # which helps make the application available faster to the end-user.
      # initialDelaySeconds: 30
      periodSeconds: 10
      successThreshold: 2
      timeoutSeconds: 4
    livenessProbe:
      failureThreshold: 3
      httpGet:
        path: /.backstage/health/v1/liveness
        port: backend
        scheme: HTTP
      # Both liveness and readiness probes won't be triggered until the startup probe is successful.
      # The startup probe is already configured to give enough time for the application to be started.
      # So removing the additional delay here allows the liveness probe to be checked right away after the startup probe,
      # which helps make the application available faster to the end-user.
      # initialDelaySeconds: 60
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 4
    extraEnvVars: []
    # Per-deployment runtime database secret. Override this list when the
    # customer uses a different Secret name; the chart reuses its first item
    # for the marketplace pre-step's POSTGRES_* references.
    extraEnvVarsSecrets:
      - veecode-runtime-secrets
    extraAppConfig:
      - configMapRef: veecode-auth
        filename: app-config.veecode-auth.yaml
      - configMapRef: veecode-branding
        filename: app-config.veecode-branding.yaml
      - configMapRef: veecode-extensions-config
        filename: app-config.extensions.yaml
      # Product identity (branding-as-values, help/support, techdocs, real
      # Tech Radar URL). LAST so it overrides earlier fragments. M4.7 / 0.1.1.
      - configMapRef: veecode-product
        filename: app-config.veecode-product.yaml
    args:
      # This additional `app-config`` file is generated by the initContainer below, and contains the merged configuration of installed dynamic plugins.
      - "--config"
      - dynamic-plugins-root/app-config.dynamic-plugins.yaml
    extraVolumeMounts:
      # The initContainer below will install dynamic plugins in this volume mount.
      - name: dynamic-plugins-root
        mountPath: /opt/app-root/src/dynamic-plugins-root
      - name: extensions-catalog
        mountPath: /extensions
      - name: temp
        mountPath: /tmp
      - name: devportal-data
        mountPath: /devportal-data
    extraVolumes:
      # -- Ephemeral volume that will contain the dynamic plugins installed by the initContainer below at start.
      - name: dynamic-plugins-root
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  # -- Size of the volume that will contain the dynamic plugins. It should be large enough to contain all the plugins.
                  storage: 5Gi
      # Volume that will expose the operator's rendered dynamic-plugins config (from the `global.dynamic`
      # field) as dynamic-plugins.operator.yaml. It is mounted OUTSIDE the installer's own
      # dynamic-plugins.yaml path — see DEVPORTAL_OPERATOR_CONFIG and merge-dynamic-plugins.js below,
      # which merge it into the level-1 file the installer actually reads.
      - name: dynamic-plugins
        configMap:
          defaultMode: 420
          name: '{{ printf "%s-dynamic-plugins" .Release.Name }}'
          optional: true
      # Optional volume that allows exposing the `.npmrc` file (through a `dynamic-plugins-npmrc` secret)
      # to be used when running `npm pack` during the dynamic plugins installation by the initContainer.
      - name: dynamic-plugins-npmrc
        secret:
          defaultMode: 420
          optional: true
          secretName: '{{ printf "%s-dynamic-plugins-npmrc" .Release.Name }}'
      # Optional volume that allows adding a container registry `auth.json` file (through a `dynamic-plugins-registry-auth` secret)
      # to be used when installing plugins from secure container registries during the dynamic plugins installation by the initContainer.
      - name: dynamic-plugins-registry-auth
        secret:
          defaultMode: 416
          optional: true
          secretName: '{{ printf "%s-dynamic-plugins-registry-auth" .Release.Name }}'
      - name: npmcacache
        emptyDir: {}
      # -- Ephemeral volume used by the install-dynamic-plugins init container to extract catalog entities from the catalog index image.
      # Mounted at the /extensions path in the backstage-backend main container for automatic discovery by the extension catalog backend providers.
      - name: extensions-catalog
        emptyDir: {}
      - name: temp
        emptyDir: {}
      - name: devportal-data
        emptyDir: {}
    initContainers:
      - name: install-dynamic-plugins
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2.5Gi
            ephemeral-storage: 5Gi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          seccompProfile:
            type: "RuntimeDefault"
        # -- Image used by the initContainer to install dynamic plugins into the `dynamic-plugins-root` volume mount.
        # It could be replaced by a custom image based on this one.
        # @default -- `quay.io/rhdh-community/rhdh:next`
        image: '{{ include "backstage.image" . }}'
        command:
          - ./install-dynamic-plugins.sh
          - /dynamic-plugins-root
        env:
          - name: NPM_CONFIG_USERCONFIG
            value: /opt/app-root/src/.npmrc.dynamic-plugins
            # This following variable is required for orchestrator to startup properly.
          - name: MAX_ENTRY_SIZE
            value: "40000000"
            # ADR-008 phase 2: the chart is the sole carrier of the index ref, consumed
            # by a moving tag (global.catalogIndex.image) instead of a per-release
            # digest pin — tenants no longer need a CATALOG_INDEX_IMAGE override.
            # The registry also publishes timestamped tags (bs_<ver>_<ts>, e.g.
            # bs_1.52.0_20260824T133841) for temporary pinning during an incident;
            # roll back by setting global.catalogIndex.image.tag to one of those
            # instead of "bs_1.52.0".
          - name: CATALOG_INDEX_IMAGE
            value: "{{ .Values.global.catalogIndex.image.registry }}/{{ .Values.global.catalogIndex.image.repository }}:{{ .Values.global.catalogIndex.image.tag }}"
          - name: CATALOG_ENTITIES_EXTRACT_DIR
            value: /devportal-data/catalog-entities-extract
          - name: DEVPORTAL_DB_PATH
            value: /devportal-data
            # Pins the marketplace regen's dedup source to the exact face path this
            # chart wires into global.dynamic.includes (OD1 phase A hardening) — so
            # dedup never silently falls back to the script's own default.
          - name: DEVPORTAL_FACE_FILE
            value: /opt/app-root/src/dynamic-plugins.veecode.yaml
            # Points merge-dynamic-plugins.js at the operator-rendered config (mounted at
            # dynamic-plugins.operator.yaml, see the `dynamic-plugins` volume above) so it can
            # merge it with DEVPORTAL_DB_PATH/extensions-install.yaml into the level-1
            # dynamic-plugins.yaml the installer actually reads.
          - name: DEVPORTAL_OPERATOR_CONFIG
            value: /opt/app-root/src/dynamic-plugins.operator.yaml
          - name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: '{{ first .Values.backstage.extraEnvVarsSecrets }}'
                key: PG_HOST
          - name: POSTGRES_PORT
            valueFrom:
              secretKeyRef:
                name: '{{ first .Values.backstage.extraEnvVarsSecrets }}'
                key: PG_PORT
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: '{{ first .Values.backstage.extraEnvVarsSecrets }}'
                key: PG_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ first .Values.backstage.extraEnvVarsSecrets }}'
                key: PG_PASSWORD
          - name: POSTGRES_DATABASE
            valueFrom:
              secretKeyRef:
                name: '{{ first .Values.backstage.extraEnvVarsSecrets }}'
                key: PG_DATABASE
        imagePullPolicy: ""
        volumeMounts:
          - mountPath: /dynamic-plugins-root
            name: dynamic-plugins-root
          - mountPath: /opt/app-root/src/dynamic-plugins.operator.yaml
            name: dynamic-plugins
            readOnly: true
            subPath: dynamic-plugins.yaml
          - mountPath: /opt/app-root/src/.npmrc.dynamic-plugins
            name: dynamic-plugins-npmrc
            readOnly: true
            subPath: .npmrc
          - mountPath: /opt/app-root/src/.config/containers
            name: dynamic-plugins-registry-auth
            readOnly: true
          - mountPath: /opt/app-root/src/.npm/_cacache
            name: npmcacache
          - name: extensions-catalog
            mountPath: /extensions
          - name: temp
            mountPath: /tmp
          - name: devportal-data
            mountPath: /devportal-data
          # The operator's appConfig, so the marketplace pre-step
          # (regenerate-extensions-install.js) reads the SAME config the backend
          # does — see global.veecode.preInstallCommand, which appends this file
          # as its last --config. `backstage-app-config` is the pod volume the
          # vendored app-config-configmap template renders from `backstage.appConfig`
          # (key app-config.yaml). REQUIRES a non-empty `backstage.appConfig`
          # (the chart ships one by default); an operator who blanks appConfig
          # entirely must also drop this mount, or the volume will not exist.
          - name: backstage-app-config
            mountPath: /opt/app-root/src/app-config-from-configmap.yaml
            subPath: app-config.yaml
            readOnly: true
        workingDir: /opt/app-root/src
    installDir: /opt/app-root/src
  ingress:
    host: "{{ .Values.global.host }}"
  metrics:
    serviceMonitor:
      enabled: false
      path: /metrics
      port: http-metrics
  postgresql:
    enabled: false
    postgresqlDataDir: /var/lib/pgsql/data/userdata
    serviceBindings:
      enabled: true
    image:
      registry: quay.io
      repository: fedora/postgresql-15
      tag: latest
    auth:
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      # TODO: https://issues.redhat.com/browse/RHIDP-2645
      podSecurityContext:
        enabled: false
      containerSecurityContext:
        enabled: false
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 250m
          memory: 1024Mi
          ephemeral-storage: 20Mi
      persistence:
        enabled: true
        size: 1Gi
        mountPath: /var/lib/pgsql/data
      extraEnvVars:
        - name: POSTGRESQL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: '{{- include "rhdh.postgresql.adminPasswordKey" . }}'
              name: '{{- include "postgresql.v1.secretName" . }}'
  service:
    extraPorts:
      - name: http-metrics
        port: 9464
        targetPort: 9464
# -- OpenShift Route parameters
route:
  # -- Route specific annotations
  annotations: {}
  # -- Enable the creation of the route resource
  enabled: false
  # -- Set the host attribute to a custom value. If not set, OpenShift will generate it, please make sure to match your baseUrl
  host: "{{ .Values.global.host }}"
  # -- Path that the router watches for, to route traffic for to the service.
  path: "/"
  # -- Wildcard policy if any for the route. Currently only 'Subdomain' or 'None' is allowed.
  wildcardPolicy: None
  # -- Route TLS parameters
  # <br /> Ref: https://docs.openshift.com/container-platform/4.9/networking/routes/secured-routes.html
  tls:
    # -- Enable TLS configuration for the host defined at `route.host` parameter
    enabled: true
    # -- Specify TLS termination.
    termination: "edge"
    # -- Certificate contents
    certificate: ""
    # -- Key file contents
    key: ""
    # -- Cert authority certificate contents. Optional
    caCertificate: ""
    # -- Contents of the ca certificate of the final destination.
    # <br /> When using reencrypt termination this file should be provided in order to have routers use it for health checks on the secure connection. If this field is not specified, the router may provide its own destination CA and perform hostname validation using the short service name (service.namespace.svc), which allows infrastructure generated certificates to automatically verify.
    destinationCACertificate: ""
    # --  Indicates the desired behavior for insecure connections to a route.
    # <br /> While each router may make its own decisions on which ports to expose, this is normally port 80. The only valid values are None, Redirect, or empty for disabled.
    insecureEdgeTerminationPolicy: "Redirect"
# -- Test pod parameters
test:
  # -- Whether to enable the test-connection pod used for testing the Release using `helm test`.
  enabled: false
  image:
    # -- Test connection pod image registry
    registry: quay.io
    # -- Test connection pod image repository. Note that the image needs to have both the `sh` and `curl` binaries in it.
    repository: curl/curl
    # -- Test connection pod image tag. Note that the image needs to have both the `sh` and `curl` binaries in it.
    tag: latest
  # -- Whether to inject a fake dynamic plugins npmrc secret.
  # <br />See RHDHBUGS-1893 and RHDHBUGS-1464 for the motivation behind this.
  # <br />This is only used for testing purposes and should not be used in production.
  # <br />Only relevant when `test.enabled` field is set to `true`.
  injectTestNpmrcSecret: false
orchestrator:
  enabled: false
  #  Disable Serverless Logic Operator if it already exists on the cluster
  serverlessLogicOperator:
    enabled: true
  #  Disable Serverless Operator if it already exists on the cluster
  serverlessOperator:
    enabled: true
  sonataflowPlatform:
    monitoring:
      enabled: true
    eventing:
      broker:
        name: ""
        namespace: ""
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    # -- Secret name for the user-created secret to connect an external DB
    externalDBsecretRef: ""
    # -- Name for the user-configured external Database
    externalDBName: ""
    # -- Host for the user-configured external Database
    externalDBHost: ""
    # -- Port for the user-configured external Database
    externalDBPort: ""
    # -- Image for the init container used by the create-db job
    initContainerImage: "{{ .Values.upstream.postgresql.image.registry }}/{{ .Values.upstream.postgresql.image.repository }}:{{ .Values.upstream.postgresql.image.tag }}"
    # -- Image for the container used by the create-db job
    createDBJobImage: "{{ .Values.upstream.postgresql.image.registry }}/{{ .Values.upstream.postgresql.image.repository }}:{{ .Values.upstream.postgresql.image.tag }}"
    # -- Number of retries for the Sonataflow database creation job if it fails
    dbCreationJobBackoffLimit: 2
    # -- (int) Time in seconds after which the Sonataflow database creation Job is automatically deleted. Leave empty to disable (recommended for GitOps/ArgoCD)
    dbCreationJobTTLSecondsAfterFinished:
    # -- Maximum time in seconds for the Sonataflow database creation Job to complete before being terminated
    dbCreationJobActiveDeadlineSeconds: 120
    # -- Image for the container used by the sonataflow jobs service, optional and used for disconnected environments
    jobServiceImage: ""
    # -- Image for the container used by the sonataflow data index, optional and used for disconnected environments
    dataIndexImage: ""
  # -- Orchestrator plugins and their configuration
  plugins:
    - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-orchestrator-backend:{{ "{{inherit}}" }}'
      enabled: true
    - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-orchestrator-form-widgets:{{ "{{inherit}}" }}'
      enabled: true
    - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-orchestrator:{{ "{{inherit}}" }}'
      enabled: true
    - package: 'oci://registry.access.redhat.com/rhdh/red-hat-developer-hub-backstage-plugin-scaffolder-backend-module-orchestrator:{{ "{{inherit}}" }}'
      enabled: true
