# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
# VeeCode owns this chart version independently from the upstream chart version recorded above.
version: 0.1.18
# 0.1.9: the marketplace pre-step sees the operator's appConfig. The init
#  container's regenerate-extensions-install.js read only the image-baked
#  app-configs, so `backend.database.prefix` (declared in the deployment's own
#  appConfig) was invisible to it — on a shared Postgres it fell back to the
#  `backstage_plugin_` default and read the wrong release's extensions database
#  (the v3 first-boot defect). Fix, pure values, no vendored-template edit: mount
#  the `backstage-app-config` ConfigMap into backstage.initContainers[0] and
#  append `--config app-config-from-configmap.yaml` (last) to
#  global.veecode.preInstallCommand. The pre-step now reads the same config as
#  the backend; per-tenant --config overrides for the DB prefix are no longer
#  needed. Chart-only change, no image or appVersion move.
# 0.1.8: Tech Radar stops answering 502. `techRadar.url` was ported from the 2.x
#  config without its companion `backend.reading.allow` entry, and the RHDH plugin
#  fetches through the backend UrlReader, which refuses unlisted hosts — so every
#  Tech Radar load failed while the page still rendered, from 0.1.3 (when Tech Radar
#  was added for face parity) to here. Also corrects the product fragment's header:
#  it is loaded LATE, not last — `app-config-from-configmap.yaml` (the deployment's
#  own appConfig) comes after it, which matters because app-config arrays replace.
# 0.1.7: TechDocs entity tab renders at full width. The docs mount point carried
#  no `config.layout`, and DynamicEntityTab wraps every mount point in
#  `<Box sx={config.layout}>` inside a 12-column grid — so the reader took one
#  column (measured 115px inside a 1624px tab). Upstream declares the same
#  `gridColumn: "1 / -1"`; its companion `if: allOf: [isTechDocsAvailable]` is
#  deliberately not carried, because it hides the tab on entities without docs.
#  Chart-only change, no image or appVersion move.
# The image tag/digest and appVersion have been re-pointed together to the
# published 3.0.0-beta.1 build; the chart version remains independently numbered.
# 0.1.x (M4.7): reproduce the VeeCode 2.x default face on the layered chart.
#  - plugins/face: add Docs/TechDocs, Notifications/Signals, Tech Radar via
#    global.dynamic.plugins; remove upstream Learning Paths; branding +
#    help/support exposed as values.
#  - UI fixes: header position above-main-content (was above-sidebar) and the
#    CompanyLogo header mount removed — kills the full-width header + the
#    stacked/duplicated logo, matching all three 2.x configs.
#  - Theming ROOT fix: retire the OCI veecode-theme (old @backstage/theme form)
#    and configure RHDH-native theming via app-config (variant: rhdh + VeeCode
#    palette). The 3.x shell reads palette.rhdh.general.* for its layout math;
#    the old theme did not implement it, which caused the sidebar<->content gap,
#    the Administration-expand shift, and the full-height loader. All resolved.
# 0.1.3 sidebar polish (all config, image stays dumb):
#  - Sidebar Search item OFF via app.sidebar.search (shell toggle, not image).
#  - Sidebar order set via menu-item priority: Home > Catalog > APIs > Docs >
#    Self-service > Notifications > Tech Radar > Marketplace. Dynamic-plugin
#    items carry priority in a menuItems block (the inline dynamicRoute menuItem
#    drops priority); core items deep-merge priority over the built-in defaults.
#  - Help/Support points at the VeeCode 2.x destination
#    (github.com/veecode-platform/support/discussions), not docs.veecode.io.
# appVersion unchanged: chart-only change; the image stays dumb.
# 0.1.11: appVersion → 3.0.0-beta.4 — first good image from the veecode/main
#  product line (Backstage 1.52, per ADR-002). beta.2 was built from the wrong
#  branch (release-1.10 = Backstage downgrade); beta.3 (main) shipped a silently
#  partial face (5 backend dist refs lacked the -dynamic suffix; the npm
#  installer warn+skips missing local packages). beta.4 fixes the refs and the
#  image build now fails if any local face ref does not resolve to a real dist
#  directory. Chart-only change beyond the image pointer.
# 0.1.10 (OD1): appVersion → 3.0.0-beta.2 — image now bakes the product face
#  (dynamic-plugins.veecode.yaml) + installer fail-closed/backstop + regen dedup;
#  tag/digest re-pointed together with appVersion.
appVersion: 3.0.0-beta.6
