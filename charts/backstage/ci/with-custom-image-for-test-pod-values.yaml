# Workaround for kind cluster in CI which has no Routes and no PVCs
route:
  enabled: false

# CI: keep the DPDY include; the values schema rejects a list without it.
global:
  dynamic:
    includes:
      - dynamic-plugins.default.yaml
  lightspeed:
    plugins: []

upstream:
  postgresql:
    primary:
      persistence:
        enabled: false

test:
  image:
    registry: quay.io
    repository: curl/curl-base
    tag: 8.11.1
