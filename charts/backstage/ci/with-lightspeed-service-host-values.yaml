# Workaround for kind cluster in CI which has no Routes and no PVCs
route:
  enabled: false

global:
  # CI: keep both product includes; the values schema rejects a list without them.
  dynamic:
    includes:
      - dynamic-plugins.default.yaml
      - /opt/app-root/src/dynamic-plugins.veecode.yaml
  # FIXME(RHIDP-15458): remove plugins override once next catalog index is stable with correct lightspeed refs in the DPDY
  lightspeed:
    plugins: []
    sidecar:
      env:
        - name: SERVICE_HOST
          value: "0.0.0.0"

upstream:
  postgresql:
    primary:
      persistence:
        enabled: false
