# Workaround for kind cluster in CI which has no Routes and no PVCs
route:
  enabled: false

global:
  # CI: keep both product includes; the values schema rejects a list without them.
  dynamic:
    includes:
      - dynamic-plugins.default.yaml
      - /opt/app-root/src/dynamic-plugins.veecode.yaml
  lightspeed:
    enabled: false
    plugins: []

upstream:
  postgresql:
    primary:
      persistence:
        enabled: false
