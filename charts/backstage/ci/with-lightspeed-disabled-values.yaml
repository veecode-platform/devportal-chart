# Workaround for kind cluster in CI which has no Routes and no PVCs
route:
  enabled: false

global:
  # CI: keep the DPDY include; the values schema rejects a list without it.
  dynamic:
    includes:
      - dynamic-plugins.default.yaml
  lightspeed:
    enabled: false
    plugins: []

upstream:
  postgresql:
    primary:
      persistence:
        enabled: false
