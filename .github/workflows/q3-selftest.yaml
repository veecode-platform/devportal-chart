name: Q3 self-test

on:
  push:
    branches:
      - m22/q3-vulnerability-scan
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: docker.io/veecode/devportal@sha256:7a3d61de5e5e8f07c5f612e8235b2dc8d46e97418e4e4d1bf40ca2c500157347

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tools on the runner
        run: |
          jq --version
          python3 --version
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)' || echo "PyYAML missing"
          yq --version || echo "yq missing"
          trivy --version || echo "no trivy on PATH"

      - name: Fixtures
        run: qualification/scan/test.sh

      - name: Exception file
        run: qualification/scan/check-ignorefile.sh

      - name: Scan the image by digest
        if: ${{ !cancelled() }}
        env:
          MODE: report
          OUT: ${{ runner.temp }}/scan-out
          TRIVY_BIN_DIR: ${{ runner.temp }}/trivy
        run: |
          start=$(date +%s)
          qualification/scan/run.sh "$IMAGE"
          echo "run.sh wall clock: $(( $(date +%s) - start )) s"
          cat "$OUT/scan-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: MODE=block on the saved report
        if: ${{ !cancelled() }}
        env:
          MODE: block
          OUT: ${{ runner.temp }}/gate-out
          TRIVY_REPORT: ${{ runner.temp }}/scan-out/trivy.json
        run: |
          code=0
          qualification/scan/run.sh "$IMAGE" || code=$?
          echo "MODE=block exit code: $code"

      - name: Compare the gate with --severity CRITICAL --ignore-unfixed
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/trivy/trivy" image --image-src remote --scanners vuln --timeout 10m \
            --no-progress --skip-version-check \
            --severity CRITICAL --ignore-unfixed --format json \
            --output "$RUNNER_TEMP/critical-fixed.json" \
            --ignorefile .trivyignore.yaml "$IMAGE"
          ids='[.Results[]? | (.Vulnerabilities // [])[] | "\(.VulnerabilityID) \(.PkgName) \(.InstalledVersion)"] | sort | .[]'
          jq -r "$ids" "$RUNNER_TEMP/critical-fixed.json" > "$RUNNER_TEMP/trivy-flags.txt"
          jq -r '[.Results[]? | (.Vulnerabilities // [])[] | select(.Severity == "CRITICAL" and .Status == "fixed")]
            | map("\(.VulnerabilityID) \(.PkgName) \(.InstalledVersion)") | sort | .[]' \
            "$RUNNER_TEMP/scan-out/trivy.json" > "$RUNNER_TEMP/gate-rule.txt"
          wc -l "$RUNNER_TEMP/trivy-flags.txt" "$RUNNER_TEMP/gate-rule.txt"
          diff "$RUNNER_TEMP/trivy-flags.txt" "$RUNNER_TEMP/gate-rule.txt" && echo "the gate matches --severity CRITICAL --ignore-unfixed"

      - name: Upload the report and the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: q3-scan-beta9
          path: |
            ${{ runner.temp }}/scan-out/trivy.json
            ${{ runner.temp }}/scan-out/scan-summary.md
          if-no-files-found: error
