name: Qualification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      chart_version:
        description: Published devportal chart version to qualify, as x.y.z or x.y.z-rc.N (for example 1.0.0-rc.1)
        required: true
        type: string
      self_test:
        description: Report the checks that need a change the candidate lacks as SKIP instead of failing them
        required: false
        type: boolean
        default: false
      inject_failure:
        description: Break the run on purpose to prove that it goes red
        required: false
        type: choice
        options:
          - none
          - missing-plugin
          - failed-sign-in
        default: none

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || format('dispatch-{0}-{1}-{2}-{3}', github.ref_name, inputs.chart_version, inputs.self_test, inputs.inject_failure) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Decide what the run qualifies
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      self_test: ${{ steps.decide.outputs.self_test }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Compare the pinned image and the qualification files with the base
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SELF_TEST_INPUT: ${{ inputs.self_test }}
        run: |
          set -euo pipefail
          image() { yq -o=json -I=0 '.upstream.backstage.image' "$1"; }
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Dispatched: qualify the published package."
            run=true
            self_test=$SELF_TEST_INPUT
          else
            git show "$BASE_SHA:charts/backstage/values.yaml" > "$RUNNER_TEMP/base-values.yaml"
            if [ "$(image "$RUNNER_TEMP/base-values.yaml")" != "$(image charts/backstage/values.yaml)" ]; then
              echo "The pinned image changed: qualify the candidate chart."
              run=true
              self_test=false
            elif [ -n "$(git diff --name-only "$BASE_SHA" HEAD -- qualification .github/workflows/qualification.yaml)" ]; then
              echo "Only the qualification changed: self-test it against the current chart."
              run=true
              self_test=true
            else
              echo "Neither the pinned image nor the qualification changed: nothing to qualify."
              run=false
              self_test=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "self_test=$self_test" >> "$GITHUB_OUTPUT"

  sequence:
    name: Sequence on KinD
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: "rmz"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Set up skopeo
        run: command -v skopeo || { sudo apt-get update && sudo apt-get install -y skopeo; }

      - name: Build the candidate chart of this pull request
        if: github.event_name == 'pull_request'
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build charts/backstage

      - name: Fetch the loaded-plugins check of devportal-local at a pinned commit
        env:
          # The merge that made the check match OCI entries by their package name.
          COMMIT: 527ead460946d9b3278f24c545295b15474dffbc
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --output "$RUNNER_TEMP/check-loaded-plugins.sh" \
            "https://raw.githubusercontent.com/veecode-platform/devportal-local/$COMMIT/scripts/check-loaded-plugins.sh"
          sha256sum "$RUNNER_TEMP/check-loaded-plugins.sh"

      - name: Create KinD cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: qualification

      - name: Previous final chart, marketplace install, upgrade, broken package, restarts, rollback
        env:
          CANDIDATE_VERSION: ${{ inputs.chart_version }}
          CANDIDATE_CHART: ${{ github.event_name == 'pull_request' && 'charts/backstage' || '' }}
          SELF_TEST: ${{ needs.scope.outputs.self_test }}
          INJECT_FAILURE: ${{ inputs.inject_failure }}
          LOADED_PLUGINS_CHECK: ${{ runner.temp }}/check-loaded-plugins.sh
          KIND_NODE: qualification-control-plane
        run: bash qualification/sequence.sh

      - name: Write the step summary
        if: always()
        run: |
          if [ -f /tmp/qualification/summary.md ]; then
            cat /tmp/qualification/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/qualification/qualification-manifest.json ]; then
            printf '\n## Qualified candidate manifest\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            jq . /tmp/qualification/qualification-manifest.json >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the sequence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-sequence
          path: /tmp/qualification
          retention-days: 14

  browser:
    name: Browser on KinD
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: "rmz"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Create KinD cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Resolve the candidate chart
        id: candidate
        env:
          EVENT: ${{ github.event_name }}
          CHART_VERSION: ${{ inputs.chart_version }}
          OUT: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            chart=charts/backstage
          else
            source qualification/lib.sh
            chart=$(fetch_release "$CHART_VERSION" "$OUT")
          fi
          echo "chart=$chart" >> "$GITHUB_OUTPUT"

      - name: Browser specs against the candidate chart
        env:
          NAMESPACE: qualification-browser
          RELEASE: devportal
          CHART: ${{ steps.candidate.outputs.chart }}
          OUT: ${{ runner.temp }}/browser
          INJECT_FAILURE: ${{ inputs.inject_failure }}
        run: bash qualification/browser/run.sh

      - name: Scan the candidate image
        if: ${{ !cancelled() }}
        env:
          CHART: ${{ steps.candidate.outputs.chart }}
          # A self-test qualifies the qualification, not an image, and a vulnerability database
          # that updates daily would turn it red for a finding no change of the pull request caused.
          MODE: ${{ needs.scope.outputs.self_test == 'true' && 'report' || 'block' }}
          OUT: ${{ runner.temp }}/scan
        run: |
          set -euo pipefail
          image=$(helm show values "$CHART" | yq '.upstream.backstage.image | .registry + "/" + .repository + "@" + .digest')
          qualification/scan/run.sh "$image"

      - name: Scan the OCI plugin artifacts the face enables by default, report only
        if: ${{ !cancelled() }}
        env:
          NAMESPACE: qualification-browser
          RELEASE: devportal
          OUT: ${{ runner.temp }}/scan/face-defaults
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          kubectl -n "$NAMESPACE" exec "deploy/$RELEASE-developer-hub" -c backstage-backend -- \
            cat /opt/app-root/src/dynamic-plugins.veecode.yaml > "$OUT/dynamic-plugins.veecode.yaml" ||
            echo "could not read the face file from the portal pod"
          qualification/scan/face-defaults.sh "$OUT/dynamic-plugins.veecode.yaml"

      - name: Write the step summary
        if: always()
        env:
          SCAN_OUT: ${{ runner.temp }}/scan
        run: |
          for summary in "$SCAN_OUT/scan-summary.md" "$SCAN_OUT/face-defaults/summary.md"; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload the browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-browser
          path: ${{ runner.temp }}/browser
          retention-days: 14

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qualification-scan
          path: ${{ runner.temp }}/scan
          if-no-files-found: error
          retention-days: 14

  qualification:
    name: Qualification
    needs:
      - scope
      - sequence
      - browser
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job the run decided on to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          say() { echo "- $*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          result() { jq -r --arg job "$1" '.[$job].result' <<< "$NEEDS"; }
          scope=$(result scope)
          say "scope: $scope"
          [ "$scope" = success ] || exit 1
          case "$(jq -r '.scope.outputs.run // ""' <<< "$NEEDS")" in
            true) want=success ;;
            false)
              want=skipped
              say "nothing to qualify, so both jobs are meant to be skipped"
              ;;
            *)
              say "scope decided nothing"
              exit 1
              ;;
          esac
          status=0
          for job in sequence browser; do
            got=$(result "$job")
            say "$job: $got, wanted $want"
            [ "$got" = "$want" ] || status=1
          done
          exit "$status"
