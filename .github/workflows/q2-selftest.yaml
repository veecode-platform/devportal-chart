# Self-test of the browser runner on its own branch. The branch's last commit
# removes this file; Q4 wires qualification/browser/run.sh into the qualification.
name: Q2 self-test - qualification browser

on:
  push:
    branches: [m22/q2-qualification-browser]

permissions:
  contents: read

concurrency:
  group: q2-selftest
  cancel-in-progress: true

jobs:
  browser:
    name: Browser specs on KinD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: "rmz"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3
      - name: Create KinD cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - name: Browser runner against the candidate chart
        run: bash qualification/browser/run.sh
        env:
          NAMESPACE: qualification-browser
          RELEASE: devportal
          CHART: charts/backstage
          OUT: ${{ runner.temp }}/browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: qualification-browser
          path: ${{ runner.temp }}/browser
          retention-days: 7
