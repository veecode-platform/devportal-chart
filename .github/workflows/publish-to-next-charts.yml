name: Publish devportal chart to next-charts

on:
  push:
    tags:
      - "chart-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the chart source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Set up yq
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3
        with:
          cmd: yq --version

      - name: Check out the next-charts channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: veecode-platform/next-charts
          ref: main
          token: ${{ secrets.NEXT_CHARTS_TOKEN }}
          path: next-charts

      - name: Package the chart
        id: package
        working-directory: source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          helm dependency build charts/backstage

          chart_name="$(helm show chart charts/backstage | yq -r '.name')"
          chart_version="$(helm show chart charts/backstage | yq -r '.version')"
          test "$chart_name" = devportal
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "chart-v${chart_version}" ]; then
            echo "Tag $REF_NAME does not match chart version $chart_version." >&2
            exit 1
          fi

          mkdir -p /tmp/devportal-chart-package
          helm package charts/backstage --destination /tmp/devportal-chart-package
          package_name="${chart_name}-${chart_version}.tgz"
          echo "name=${chart_name}" >> "$GITHUB_OUTPUT"
          echo "version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "package=${package_name}" >> "$GITHUB_OUTPUT"

      - name: Refuse a published version
        env:
          CHART_NAME: ${{ steps.package.outputs.name }}
          CHART_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_NAME: ${{ steps.package.outputs.package }}
        run: |
          set -euo pipefail
          package_path="next-charts/docs/${PACKAGE_NAME}"
          if [ -e "$package_path" ]; then
            echo "Refusing to overwrite published package $package_path." >&2
            exit 1
          fi
          if [ -f next-charts/docs/index.yaml ] && \
            yq -e --arg chart "$CHART_NAME" --arg version "$CHART_VERSION" \
              '.entries[$chart][] | select(.version == $version)' \
              next-charts/docs/index.yaml >/dev/null; then
            echo "Refusing to overwrite published ${CHART_NAME}-${CHART_VERSION}." >&2
            exit 1
          fi

      - name: Open a package-only next-charts PR
        env:
          GH_TOKEN: ${{ secrets.NEXT_CHARTS_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.package }}
          CHART_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          test -z "$(git -C next-charts status --porcelain)"
          cp "/tmp/devportal-chart-package/${PACKAGE_NAME}" "next-charts/docs/${PACKAGE_NAME}"
          branch="publish/devportal-${CHART_VERSION}"
          git -C next-charts config user.name "github-actions[bot]"
          git -C next-charts config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C next-charts switch -c "$branch"
          git -C next-charts add -- "docs/${PACKAGE_NAME}"
          git -C next-charts diff --cached --quiet && {
            echo "The package-only PR has no changes; publication may already exist." >&2
            exit 1
          }
          git -C next-charts commit -m "publish: devportal ${CHART_VERSION}"
          git -C next-charts push --set-upstream origin "$branch"
          gh pr create \
            --repo veecode-platform/next-charts \
            --head "$branch" \
            --base main \
            --title "publish: devportal ${CHART_VERSION}" \
            --body "Package-only publication from veecode-platform/devportal-chart at ${GITHUB_SHA}. The channel workflow must index docs/*.tgz after this PR merges."
