name: Publish devportal chart release

on:
  push:
    tags:
      - "chart-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the chart source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Package and validate the chart
        id: package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          package_dir="${RUNNER_TEMP}/devportal-chart-package"
          mkdir -p "${package_dir}"

          chart_metadata="$(helm show chart charts/backstage)"
          chart_name="$(printf '%s\n' "${chart_metadata}" | awk -F': ' '$1 == "name" { print $2; exit }')"
          chart_version="$(printf '%s\n' "${chart_metadata}" | awk -F': ' '$1 == "version" { print $2; exit }')"
          if [ "${chart_name}" != "devportal" ]; then
            echo "::error::expected chart name devportal, got ${chart_name:-<empty>}"
            exit 1
          fi
          if [ -z "${chart_version}" ]; then
            echo "::error::could not read the chart version from charts/backstage/Chart.yaml"
            exit 1
          fi

          expected_tag="chart-v${chart_version}"
          if [ "${REF_TYPE}" = "tag" ] && [ "${REF_NAME}" != "${expected_tag}" ]; then
            echo "::error::tag ${REF_NAME} does not match Chart.yaml version ${chart_version} (expected ${expected_tag})"
            exit 1
          fi

          helm package charts/backstage \
            --dependency-update \
            --destination "${package_dir}"
          package_path="${package_dir}/devportal-${chart_version}.tgz"
          if [ ! -f "${package_path}" ]; then
            echo "::error::Helm did not produce the expected package ${package_path}"
            exit 1
          fi

          embedded_metadata="$(helm show chart "${package_path}")"
          embedded_name="$(printf '%s\n' "${embedded_metadata}" | awk -F': ' '$1 == "name" { print $2; exit }')"
          embedded_version="$(printf '%s\n' "${embedded_metadata}" | awk -F': ' '$1 == "version" { print $2; exit }')"
          if [ "${embedded_name}" != "devportal" ]; then
            echo "::error::packaged chart embeds name ${embedded_name:-<empty>}, expected devportal"
            exit 1
          fi
          if [ "${embedded_version}" != "${chart_version}" ]; then
            echo "::error::packaged chart embeds version ${embedded_version:-<empty>}, expected ${chart_version}"
            exit 1
          fi

          checksum_path="${package_dir}/devportal-${chart_version}.tgz.sha256"
          (
            cd "${package_dir}"
            sha256sum "$(basename "${package_path}")" > "$(basename "${checksum_path}")"
          )

          echo "tag=${expected_tag}" >> "${GITHUB_OUTPUT}"
          echo "chart_version=${chart_version}" >> "${GITHUB_OUTPUT}"
          echo "package_path=${package_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${checksum_path}" >> "${GITHUB_OUTPUT}"

      - name: Create or complete the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
          CHART_VERSION: ${{ steps.package.outputs.chart_version }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            asset_count="$(gh release view "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets | length')"
            if [ "${asset_count}" -gt 0 ]; then
              echo "::error::release ${TAG} already has ${asset_count} asset(s); refusing to republish an immutable version"
              exit 1
            fi
            echo "Release ${TAG} exists without assets; attaching the first package for ${CHART_VERSION}."
            gh release upload "${TAG}" \
              "${PACKAGE_PATH}" \
              "${CHECKSUM_PATH}" \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" \
              "${PACKAGE_PATH}" \
              "${CHECKSUM_PATH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --notes "Helm chart devportal ${CHART_VERSION}."
          fi
